name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # required for npm provenance

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile

      # A tag that disagrees with package.json publishes a version nobody can
      # trace back to a commit. Fail here instead.
      - name: Tag matches package.json version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${pkg}" >&2
            exit 1
          fi

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

      # prepublishOnly runs the build; --provenance signs it with the workflow's
      # identity so npm can show the commit this tarball was built from.
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
