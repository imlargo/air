name: CI

on:
  push:
    branches: [main]
  pull_request:

# There are no hooks to install on a CI checkout, and `prepare` runs on every
# install. Husky's documented way to opt out of that is this variable.
env:
  HUSKY: 0

jobs:
  check:
    name: Format, lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The pre-commit hook already formats, but a hook is local and skippable
      # (`--no-verify`, a fresh clone that never ran `pnpm install`, a GUI client).
      # This is the copy that actually holds the line.
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  compat:
    name: Built output on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6

      # The build toolchain needs a modern Node (tsdown requires >=22.18) even
      # though what it emits runs on 20, so build here, then switch below.
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # Runs the built dist/ on the oldest version `engines` claims, so the claim
      # is verified rather than asserted. No test runner: vitest itself needs >=20.
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: node scripts/smoke.mjs

      - run: node scripts/examples.mjs

  runtimes:
    name: Built output on ${{ matrix.runtime }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runtime: [bun, deno]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # The README claims Bun and Deno. The smoke test uses only web-standard APIs plus
      # `node:assert` and `process.version`, which both runtimes provide.
      - if: matrix.runtime == 'bun'
        uses: oven-sh/setup-bun@v2
      - if: matrix.runtime == 'bun'
        run: bun scripts/smoke.mjs
      - if: matrix.runtime == 'deno'
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - if: matrix.runtime == 'deno'
        run: deno run --allow-net --allow-read scripts/smoke.mjs
