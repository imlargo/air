name: Bug report
description: air did something its documentation does not describe
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: air version
      placeholder: 2.1.0
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Runtime and version
      placeholder: Node 22.18, Bun 1.3, Deno 2.4, Chrome 140, Cloudflare Workers ...
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: The smallest code that shows the problem. A `fetch` double instead of a real server is ideal; see `examples/testing.ts`.
      render: ts
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected, and what happened instead
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: Does plain `fetch` behave the same? Does another client? A link to the README section you were following helps.
